<header data-bs-theme="dark">
      <div class="collapse text-bg-dark" id="navbarHeader">
        <div class="container">
          <div class="row">
            <div class="col-sm-8 col-md-7 py-4">
              <h4>О нас</h4>
              <p class="text-body-secondary">
                Мы онлайн магазин. Самые низкие цены у нас.
                Самые свежие товары у нас.
              </p>
            </div>
            <div class="col-sm-4 offset-md-1 py-4">
              <h4>Контакты</h4>
              <ul class="list-unstyled">
                <li><a href="#" class="text-white">Обратная связь</a></li>
                <li><a href="#" class="text-white">Инстаграм</a></li>
                <li><a href="#" class="text-white">Напиши нам</a></li>
                {% if user.is_authenticated %}
                      <li class="nav-item">
	                    <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
	                        {% csrf_token %}
	                        <button type="submit" class="btn btn-link nav-link">Выйти
	                        </button>
	                    </form>
	                  </li>
                  {% else %}
                      <li class="nav-item">
                              {% csrf_token %}
                                <a href="{% url 'users:register' %}">Регистрация</a>
                      </li>
                      <li class="nav-item">
                              {% csrf_token %}
                                <a href="{% url 'users:login' %}">Войти</a>
                      </li>
                  {% endif %}
              </ul>
            </div>
          </div>
        </div>
      </div>
      <div class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
          <a href="#" class="navbar-brand d-flex align-items-center">
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarHeader"
            aria-controls="navbarHeader"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
      </div>
    </header>
