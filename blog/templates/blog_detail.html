{% extends 'base.html' %}
{% load blog/templatetags/my_tags %}
{% block content %}
<main>
  <section class="py-1 text-center container">
    <div class="row py-lg-5">
      <div class="col-lg-6 col-md-8 mx-auto">
        <h1 class="fw-light">{{ blog.name }}</h1>
        <p class="lead text-body-secondary">
          {{ blog.description | truncatechars:400 }}
        </p>
      </div>
    </div>
  </section>
  <div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
        <div class="col">
          <div class="card shadow-sm">
            <img aria-label="Placeholder: Thumbnail"
                class="bd-placeholder-img card-img-top"
                height="225"
                preserveAspectRatio="xMidYMid slice"
                role="img"
                width="100%"
                src="{{ blog.image_blog | media_filter }}"
              >
            <div class="card-body">
              <p class="card-text">
                Количество просмотров: {{ blog.count_views }}
              </p>
              <div
                class="d-flex justify-content-between align-items-center"
              >
                <div class="btn-group">
                  <a class="btn btn-primary" href="{% url 'blog:blog_list' %}" role="button">Назад</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
