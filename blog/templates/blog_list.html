{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
<main>
  <section class="py-1 text-center container">
    <div class="row py-lg-5">
      <div class="col-lg-6 col-md-8 mx-auto">
        <h1 class="fw-light">Список блогов</h1>
        <div class="btn-group">
          <a class="btn btn-primary" href="{% url 'blog:new_blog' %}" role="button">Добавить блог</a>
        </div>
      </div>
    </div>
  </section>
  <div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
      {% for blog in blogs %}
          <div class="col">
            <div class="card shadow-sm">
              <img aria-label="Placeholder: Thumbnail"
                class="bd-placeholder-img card-img-top"
                height="225"
                preserveAspectRatio="xMidYMid slice"
                role="img"
                width="100%"
                src="{{ blog.image_blog | media_filter }}"
              >
              <div class="card-body">
                <p class="card-text">
                  {{ blog.name }}
                </p>
                <div class="d-flex justify-content-between align-items-center">
                  <div class="btn-group">
                    <a class="btn btn-primary" href="{% url 'blog:blog_detail' blog.pk %}" role="button">О блоге</a>
                    <a class="btn btn-primary" href="{% url 'blog:upd_blog' blog.pk %}" role="button">Внести правки</a>
                    <a class="btn btn-primary" href="{% url 'blog:del_blog' blog.pk %}" role="button">Удалить</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</main>
{% endblock %}
